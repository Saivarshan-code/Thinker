{% extends "question/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}

<style media="screen">
  #ok,#cancel{
    display: inline-block;
  }
</style>


<h1>Ask your question down below</h1>

<div class="jumbotron">
  <form method="POST" enctype="multipart/form-data">
    {{ error }}
    {% csrf_token %}
    <p>{{question|crispy}}</p>
    <button id="ok" class="btn btn-primary" href="{% url 'question:new_question' %}" type="submit"><span class="fa fa-check-circle"></span></button>
    <a id="cancel" href="{% url 'index' %}" class="btn btn-secondary"><span class="fa fa-close"></span></a>
  </form>
  <br>

</div>


{% endblock %}
