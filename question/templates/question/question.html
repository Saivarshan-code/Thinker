{% extends "question/base.html" %}
{% load static %}
{% block content %}

<h1>Ask your question down below</h1>

<div class="jumbotron">
  <form method="POST" enctype="multipart/form-data">
    {{ error }}
    {% csrf_token %}

    {% for field in question %}
    <p>
    {{ field.errors }}
    {{ field.label_tag }}
    {{ field }}
    <span class="text-muted">{{ field.help_text }}</span>
  </p>
    {% endfor %}

    <!-- {{ question.as_p }} -->
    <button class="btn btn-primary" href="{% url 'question:new_question' %}" type="submit">Ask</button>
  </form><br>
  <form action="{% url 'index' %}" method="post">
    {% csrf_token %}
    <button class="btn btn-secondary" href="{% url 'index' %}" type="submit">Cancel</button>
  </form>

</div>



{% endblock %}
