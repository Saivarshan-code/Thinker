<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Thinker</title>
    <meta name="viewport" content="width=device-width", initial-scale=1.0>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'css/question_page.css' %}">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&family=Raleway:wght@600&family=Roboto:wght@500&family=Ubuntu:wght@500&display=swap" rel="stylesheet">


    <style media="screen">
    body{
      font-size: 16px;
      background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjK8RgPhUofA_D-3ioqeXlOn-fr3ISsH4zng&usqp=CAU);
      background-size: cover;
    }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary ">


      <a class="navbar-brand" href="{% url 'index' %}">Thinker</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav">
            <a class="nav-link" href="{% url 'index' %}">Home </a>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'question:myquestions' %}">My questions</a>
          </li>
          <form class="form-inline my-2 my-lg-0">
            {% if user.is_authenticated %}
            <li class="nav-item form-inline mt-2 mt-md-0">
              <a role="button" class="form-control mr-sm-2 btn-danger" href="{% url 'logout' %}">LogOut</a>
            </li>
          {% else %}
            <li class="nav-item">
              <a role="button" class="form-control mr-sm-2 btn btn-danger" href="{% url 'signup' %}">SignUp</a>
            </li>
            <li class="nav-item">
              <a role="button" class="form-control mr-sm-2 btn btn-danger" href="{% url 'login' %}">Login</a>
            </li>
          {% endif %}
        </form>


        </ul>
      </div>
    </nav>
    <div class="container">
      {% block content %}

      {% endblock %}
    </div>



  </body>
</html>
