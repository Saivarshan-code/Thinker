{% extends "users/base.html" %}
{% block content %}

{% if signed_up %}
<div class="jumbotron">
  <h1>Thank You for registering</h1>
</div>

{% else %}
  <h1>SignUp Below</h1>

<form method="post">
  {% csrf_token %}
  {{ user_form.as_p }}
  {{ user_profile_form.as_p }}
  <button class="btn btn-primary" type="submit" name="button">SignUp</button>
</form>
{% endif %}
{% endblock %}
